[permalinks]
  posts = "/aktuelles/:year-:month-:day-:slug/"
  pages = "/:slug/"
  events = "/unterstuetzen/termine/:year-:month-:day-:slug/"

[outputFormats]
  [outputFormats.ICS]
    mediaType = "text/calendar"
    baseName = "index"
    isPlainText = true
    rel = "alternate"
    permalinkable = true

[outputs]
  page = ["HTML"]

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^TURNSTILE_SITE_KEY$']
