buildFuture = true

baseURL = "https://verafides.ch/"
languageCode = "de-ch"
title = "Verafides"
enableRobotsTXT = true


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = true
      unsafe = true

# Für Inhalte
[pagination]
  pagerSize = 10

[params.social]
  facebook = "https://www.facebook.com/people/Vera-Fides/"
  youtube = "https://www.youtube.com/@VereinVeraFides"

