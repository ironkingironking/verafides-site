[permalinks]
  posts = "/aktuelles/:year-:month-:day-:slug/"
  pages = "/:slug/"
events = "/unterstuetzen/veranstaltungen/:year-:month-:day-:slug/"

[outputFormats]
  [outputFormats.ICS]
    mediaType = "text/calendar"
    baseName = "index"
    isPlainText = true
    rel = "alternate"
    permalinkable = true

[outputs]
  page = ["HTML", "ICS"]

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^TURNSTILE_SITE_KEY$']
