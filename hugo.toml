buildFuture = true

baseURL = "https://verafides.ch/"
languageCode = "de-ch"
title = "Vera Fides"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
description = "Vera Fides ist ein katholischer Verein in der Schweiz für Glaubensverkündigung, Neuevangelisierung, katholische Bildung, Veranstaltungen und Vernetzung lehramtstreuer Katholiken."
siteName = "Vera Fides"
defaultImage = "/images/vera-fides-header.png"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = true
      unsafe = true

# Für Inhalte
[pagination]
  pagerSize = 10

[params.social]
  facebook = "https://www.facebook.com/people/Vera-Fides/100079785356046/"
  youtube = "https://www.youtube.com/@VereinVeraFides"

