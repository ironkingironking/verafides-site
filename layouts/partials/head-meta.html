<meta name="description" content="{{ with .Params.summary }}{{ . | plainify }}{{ else }}{{ .Summary | plainify }}{{ end }}"/>

<meta property="og:site_name" content="{{ .Site.Title }}"/>
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}"/>
<meta property="og:description" content="{{ with .Params.summary }}{{ . | plainify }}{{ else }}{{ .Summary | plainify }}{{ end }}"/>
<meta property="og:type" content="{{ if eq .Section "events" }}event{{ else }}website{{ end }}"/>
<meta property="og:url" content="{{ .Permalink }}"/>

{{ with .Params.image }}
<meta property="og:image" content="{{ . | absURL }}"/>
<meta name="twitter:card" content="summary_large_image"/>
{{ else }}
<meta name="twitter:card" content="summary"/>
{{ end }}
<meta name="twitter:title" content="{{ .Title }}"/>
<meta name="twitter:description" content="{{ with .Params.summary }}{{ . | plainify }}{{ else }}{{ .Summary | plainify }}{{ end }}"/>
