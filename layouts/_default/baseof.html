<!doctype html>
<html lang="{{ .Site.LanguageCode | default "de" }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
{{ partial "head-meta.html" . }}

    <link rel="stylesheet" href="/css/main.css" />

    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  </head>
  <body class="bg-white text-slate-900">
    {{ partial "header.html" . }}

    <main class="mx-auto max-w-3xl px-4 py-8">
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="border-t border-slate-200">
      <div class="mx-auto max-w-3xl px-4 py-6 text-sm text-slate-500">
        <div class="flex flex-col items-start gap-3 md:flex-row md:items-center md:gap-10">
          <span class="leading-relaxed">© {{ now.Year }} {{ .Site.Title }}</span>
          <a class="leading-relaxed hover:text-slate-700 underline underline-offset-4" href="{{ "/impressum/" | relURL }}">Impressum</a>
          <a class="leading-relaxed hover:text-slate-700 underline underline-offset-4" href="{{ "/datenschutz/" | relURL }}">Datenschutz</a>
        </div>
      </div>
    </footer>
  </body>
</html>
