{{ define "main" }}
  <section class="space-y-6">
    <header class="space-y-2">
      <h1 class="text-3xl font-semibold tracking-tight">{{ .Title }}</h1>
      {{ with .Content }}
        <div class="prose prose-slate max-w-none">{{ . }}</div>
      {{ end }}
    </header>

    <ul class="space-y-3">
      {{ range .Pages }}
        <li class="rounded-xl border border-slate-200 p-4">
          <a class="text-lg font-semibold hover:underline" href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{ with .Date }}<div class="text-sm text-slate-500 mt-1">{{ .Format "02.01.2006" }}</div>{{ end }}
        </li>
      {{ end }}
    </ul>
  </section>
{{ end }}
