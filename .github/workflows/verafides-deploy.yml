name: Deploy Verafides

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Verafides deploy
        env:
          VERAFIDES_DEPLOY_TOKEN: ${{ secrets.VERAFIDES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$VERAFIDES_DEPLOY_TOKEN" ]; then
            echo "::notice::VERAFIDES_DEPLOY_TOKEN is not configured. Server-side polling deploy is active."
            exit 0
          fi
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -d '{"ref":"refs/heads/main","deleted":false,"repository":{"full_name":"ironkingironking/verafides-site"}}' \
            "https://verafides.ch/api/deploy/verafides/$VERAFIDES_DEPLOY_TOKEN"
