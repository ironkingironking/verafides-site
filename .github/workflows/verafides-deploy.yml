name: Deploy Verafides

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "assets/**"
      - "content/**"
      - "hugo.toml"
      - "layouts/**"
      - "package-lock.json"
      - "package.json"
      - "static/**"
      - "tailwind.config.js"
      - ".github/workflows/verafides-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Verafides deploy
        env:
          VERAFIDES_DEPLOY_TOKEN: ${{ secrets.VERAFIDES_DEPLOY_TOKEN }}
        run: |
          token="$(printf '%s' "$VERAFIDES_DEPLOY_TOKEN" | sed -E 's/^[[:space:]]*VERAFIDES_DEPLOY_TOKEN=//; s/^[[:space:]]+//; s/[[:space:]]+$//' | tr -d '\r\n')"
          token="${token%\"}"
          token="${token#\"}"
          token="${token%\'}"
          token="${token#\'}"

          if [ -z "$token" ]; then
            echo "::error::VERAFIDES_DEPLOY_TOKEN is not configured."
            exit 1
          fi
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -d '{"ref":"refs/heads/main","deleted":false,"repository":{"full_name":"ironkingironking/verafides-site"}}' \
            "https://verafides.ch/api/deploy/verafides/$token"
